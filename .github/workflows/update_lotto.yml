name: Update Lotto Data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 기본 UTC 기준.
    # 토요일 22:45 KST = 토요일 13:45 UTC
    - cron: "45 13 * * 6"
    # 일요일 00:45 KST = 토요일 15:45 UTC
    - cron: "45 15 * * 6"

permissions:
  contents: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: true

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update lotto_data.json
        env:
          PYTHONUNBUFFERED: "1"
          LOTTO_HISTORY_LIMIT: "120"
          DHL_TIMEOUT: "3"
          PAGE_TIMEOUT: "10"
          LOTTO_SOURCE_ORDER: "lottotapa_all,dhlottery,lottotapa_single"
        run: |
          python -u fetch_lotto.py

      - name: Validate JSON
        run: |
          python -m json.tool lotto_data.json > /tmp/lotto_data_check.json
          python - <<'PY'
          import json
          data = json.load(open("lotto_data.json", encoding="utf-8"))
          assert data["status"] == "ok"
          assert data["latest_round"] >= 1
          assert len(data["draws"]) >= 1
          print("JSON_OK")
          print("latest_round =", data["latest_round"])
          print("total =", data["total"])
          print("sources =", data.get("sources"))
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain lotto_data.json)" ]; then
            echo "변경 없음"
          else
            git add lotto_data.json
            git commit -m "Update lotto data"
            git push
            echo "업데이트 커밋 완료"
          fi
