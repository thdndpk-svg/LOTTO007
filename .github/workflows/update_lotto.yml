name: 로또 데이터 자동 업데이트

on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 데이터 수집 실행
        run: python fetch_lotto.py

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotto_data.json
          git diff --staged --quiet || git commit -m "lotto update $(date +'%Y-%m-%d')"
          git push
